version: 2

updates:
  # Keeps the SHA-pinned actions in .github/workflows/ up to date. Dependabot
  # understands the `uses: owner/repo@<sha> # vX.Y.Z` form and rewrites the SHA
  # and the version comment together, so pinning costs nothing in maintenance.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "07:00"
      timezone: Europe/Stockholm
    # One PR a month covering every action, rather than one PR per action.
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
